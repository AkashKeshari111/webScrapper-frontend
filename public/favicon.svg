<svg width="140" height="140" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- background -->
  <rect width="140" height="140" rx="28" fill="#0A0F1C"/>

  <!-- inner card (tight) -->
  <rect x="34" y="28" width="72" height="84" rx="14" fill="#FFFFFF"/>

  <!-- text lines (compact) -->
  <rect x="44" y="42" width="52" height="6" rx="3" fill="#94A3B8"/>
  <rect x="44" y="56" width="44" height="6" rx="3" fill="#94A3B8"/>
  <rect x="44" y="70" width="48" height="6" rx="3" fill="#94A3B8"/>

  <!-- tight S-scrape flow -->
  <path d="M28 78
           C40 62, 60 92, 70 78
           C80 62, 100 92, 112 78"
        stroke="#38BDF8"
        stroke-width="5"
        fill="none"
        stroke-linecap="round"/>

  <!-- nodes close to flow -->
  <circle cx="28" cy="78" r="4" fill="#F97316"/>
  <circle cx="70" cy="78" r="4" fill="#38BDF8"/>
  <circle cx="112" cy="78" r="4" fill="#F97316"/>

</svg>